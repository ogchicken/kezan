name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: busted and luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WoW runs Lua 5.1 (ADR 0003).
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install busted and luacheck
        run: |
          luarocks install busted
          luarocks install luacheck

      - name: luacheck
        run: luacheck .

      - name: busted
        run: busted
